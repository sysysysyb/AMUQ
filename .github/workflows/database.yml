name: Database

on:
  pull_request:
  push:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: amuq_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amuq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amuq_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amuq_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:check
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Smoke test production API
        run: |
          set -euo pipefail
          node apps/api/dist/http/index.js &
          api_pid=$!
          trap 'kill -TERM "$api_pid" 2>/dev/null || true' EXIT
          curl --retry 30 --retry-delay 1 --retry-all-errors --fail --silent http://127.0.0.1:3001/ready
          kill -TERM "$api_pid"
          wait "$api_pid"
          trap - EXIT
