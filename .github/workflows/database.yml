name: Database

on:
  pull_request:
  push:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: amuq_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amuq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AMUQ_ENV: test
      AUTH_RATE_LIMIT_SECRET: ci-rate-limit-secret-32-bytes-long
      AUTH_TOKEN_SECRET: ci-auth-token-secret-32-bytes-long
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amuq_test
      RESEND_API_KEY: re_ci_not-a-real-api-key
      RESEND_FROM_EMAIL: "AMUQ <account@example.com>"
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amuq_test
      WEB_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - run: npm install --global corepack@0.34.6
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm db:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test --exclude "apps/api/test/integration/**"
      - run: pnpm test:integration
      - run: pnpm db:migrate
      - run: pnpm test:e2e
      - name: Smoke test built API
        run: |
          set -euo pipefail
          node apps/api/dist/http/index.js &
          api_pid=$!
          trap 'kill -TERM "$api_pid" 2>/dev/null || true' EXIT
          curl --retry 30 --retry-delay 1 --retry-all-errors --fail --silent http://127.0.0.1:3001/ready
          kill -TERM "$api_pid"
          wait "$api_pid"
          trap - EXIT
      - name: Smoke test built worker
        run: |
          set -euo pipefail
          worker_log="${RUNNER_TEMP}/amuq-worker.log"
          node apps/api/dist/worker.js >"$worker_log" 2>&1 &
          worker_pid=$!
          trap 'kill -TERM "$worker_pid" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            grep -Fxq 'AMUQ_WORKER_READY' "$worker_log" && break
            kill -0 "$worker_pid"
            sleep 1
          done
          grep -Fxq 'AMUQ_WORKER_READY' "$worker_log"
          kill -TERM "$worker_pid"
          wait "$worker_pid"
          trap - EXIT
