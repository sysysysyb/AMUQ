# Issue와 PR의 제목과 소제목은 영어, 본문은 한국어로 작성하며 기술 식별자와 명령은 원문을 유지합니다.
name: Feature
description: 승인된 계획에서 사용자가 확인할 수 있는 기능 한 단위를 전달합니다.
title: "[Feature] "
labels:
  - "feature"
body:
  - type: input
    id: requirement_ids
    attributes:
      label: Requirement IDs
      placeholder: U1, U2
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: User-visible outcome
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: input
    id: dependencies
    attributes:
      label: Dependencies
      placeholder: 없음
  - type: input
    id: design
    attributes:
      label: Design references
      placeholder: Figma URL 또는 docs/DESIGN.md의 해당 항목
  - type: textarea
    id: tests
    attributes:
      label: Tests and E2E flows
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: Exclusions
    validations:
      required: true
