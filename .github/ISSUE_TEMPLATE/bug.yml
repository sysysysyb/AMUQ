name: Bug
description: Report reproducible behavior that conflicts with an approved requirement.
title: "[Bug] "
labels:
  - "type:bug"
body:
  - type: textarea
    id: current
    attributes:
      label: Current behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Include concise logs, screenshots, or recording links without secrets.
  - type: input
    id: requirement_ids
    attributes:
      label: Related requirement IDs
      placeholder: U1, U2, or None
