services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: amuq_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - amuq-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d amuq_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  amuq-postgres-data:
